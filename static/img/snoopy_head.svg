<svg width="312" height="272" viewBox="14 10 312 272" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Snoopy-style beagle head, three-quarter view facing left. -->

  <!-- neck, behind the head so it only shows between chin and collar -->
  <path d="M154 226 L151 250 M204 232 L207 250" stroke="#1E1A15" stroke-width="8" stroke-linecap="round"/>

  <!-- collar -->
  <rect x="132" y="244" width="88" height="30" rx="9"
        transform="rotate(-3 176 259)"
        fill="#E5384C" stroke="#1E1A15" stroke-width="8" stroke-linejoin="round"/>

  <!-- head -->
  <path d="M20 117 C20 88 38 56 72 47 C88 38 110 40 120 52 C134 30 160 16 198 16 C246 16 300 60 307 121 C311 165 292 201 258 222 C244 232 180 236 145 224 C118 216 66 188 41 153 C30 139 21 130 20 117 Z"
        fill="#FFFFFF" stroke="#1E1A15" stroke-width="8" stroke-linejoin="round"/>

  <!-- ear: sits on top and breaks the head contour on the right -->
  <ellipse cx="280" cy="176" rx="39" ry="57" transform="rotate(-18 280 176)"
           fill="#1E1A15" stroke="#1E1A15" stroke-width="8" stroke-linejoin="round"/>

  <!-- smile -->
  <path d="M60 152 C66 180 92 197 126 194 C162 191 191 183 196 166"
        fill="none" stroke="#1E1A15" stroke-width="8" stroke-linecap="round"/>

  <!-- nose -->
  <ellipse cx="97" cy="106" rx="34" ry="24" transform="rotate(-15 97 106)" fill="#1E1A15"/>

  <!-- eyes -->
  <ellipse cx="165" cy="85" rx="6.5" ry="11" transform="rotate(8 165 85)" fill="#1E1A15"/>
  <ellipse cx="193" cy="81" rx="6.5" ry="11" transform="rotate(8 193 81)" fill="#1E1A15"/>
</svg>
